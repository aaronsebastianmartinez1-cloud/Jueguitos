<head>
<meta charset="UTF-8">

<title>Clau 🐣 – Aventura de 6 Mundos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#1a1a2e;overflow:hidden;touch-action:none;font-family:'Courier New',monospace;}
#rotate-msg{display:none;position:fixed;inset:0;background:#1a1a2e;z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#FFD700;text-align:center;padding:20px;}
#rotate-msg .icon{font-size:60px;animation:spin 1.4s ease-in-out infinite alternate;}
@keyframes spin{from{transform:rotate(-30deg);}to{transform:rotate(30deg);}}
#rotate-msg p{font-size:18px;font-weight:600;color:#fff;}
#rotate-msg small{font-size:13px;color:#aaa;}
#gw{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:4px;position:relative;}
#hud{display:flex;gap:14px;font-size:13px;font-weight:600;color:#FFD700;text-shadow:0 1px 3px #000;z-index:10;}
#msg{font-size:12px;font-weight:500;color:#fff;min-height:16px;text-align:center;text-shadow:0 1px 4px #000;z-index:10;}
#ctrl{font-size:10px;color:#aaa;text-align:center;}
#gc{display:block;border:3px solid #5a3e1b;border-radius:8px;image-rendering:pixelated;cursor:none;}
#touch-controls{display:none;position:fixed;bottom:0;left:0;right:0;pointer-events:none;z-index:20;padding:8px 12px;justify-content:space-between;align-items:flex-end;user-select:none;-webkit-user-select:none;}
.btn-group{display:flex;gap:6px;pointer-events:all;}
.tbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,0.5);-webkit-tap-highlight-color:transparent;transition:background 0.08s;cursor:pointer;pointer-events:all;}
.tbtn:active,.tbtn.pressed{background:rgba(255,215,0,0.22);border-color:rgba(255,215,0,0.5);color:rgba(255,215,0,0.9);}
#btn-jump{width:60px;height:60px;background:rgba(255,100,50,0.08);border-color:rgba(255,140,60,0.2);font-size:22px;color:rgba(255,180,100,0.5);}
#btn-jump:active,#btn-jump.pressed{background:rgba(255,120,60,0.28);border-color:rgba(255,160,60,0.6);color:rgba(255,200,80,0.95);}
@media(max-width:900px)and(orientation:landscape){#ctrl{display:none;}#touch-controls{display:flex;}}
@media(max-width:600px)and(orientation:portrait){#rotate-msg{display:flex;}}
</style>

  <div id="touch-controls">

function resizeCanvas(){
  const gw=document.getElementById('gw');
  const s=Math.min((gw.clientWidth-20)/CW,(gw.clientHeight-80)/CH);
  cv.style.width=(CW*s)+'px'; cv.style.height=(CH*s)+'px';
}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,200));

// ── Fuegos artificiales ──────────────────────────
function spawnFW(wx2,wy){
  fws.push({
    wx:wx2, wy:wy,
    parts:Array.from({length:24},()=>({
      a:Math.random()*Math.PI*2,
      spd:1.2+Math.random()*2.8,
      col:`hsl(${Math.random()*360|0},100%,62%)`,
      px:0, py:0, life:1
    })),
    life:1
  });
}

function tickFW(){
  fws.forEach(fw=>{
    fw.life-=0.018;
    fw.parts.forEach(p=>{
      p.px+=Math.cos(p.a)*p.spd;
      p.py+=Math.sin(p.a)*p.spd+0.06;
      p.spd*=0.97;
      p.life-=0.022;
    });
  });
  fws=fws.filter(f=>f.life>0);
}

function rc(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

// ── Runtime ──────────────────────────────────────
let W,mp,mp2,mp3;
function loadWorld(idx){
  W=WORLDS[idx];
  WW=WWS[idx];
  mp=Object.assign({},W.mp);
  mp2=W.mp2?Object.assign({},W.mp2):null;
  mp3=W.mp3?Object.assign({},W.mp3):null;
  camX=0; winT=0; celebT=0; fws=[];
  enemies=W.enemyDefs.map(d=>({
    ...d, hpCur:d.hp,
    shootTimer:Math.floor(Math.random()*(d.shootCd||80)+20),
    alive:true, frame:0, ft:0, dmgFlash:0,
  }));
  projectiles=[];
  extraLife={...W.elDef, collected:false, pulse:0};
  checkpointX=null; checkpointActive=false;
  if(W.checkpoint) checkpointX=W.checkpoint.x;
  document.getElementById('hWorld').textContent='🌍 Mundo '+(idx+1);
}
loadWorld(0);

function mkPl(cx,cy){
  return{x:cx??40,y:cy??(GY-44),w:30,h:36,vx:0,vy:0,
         onGround:false,jumps:0,dir:1,frame:0,ft:0,alive:true};
}
let pl=mkPl();

// ── Física ───────────────────────────────────────
function resolve(){
  pl.onGround=false;
  const all=[...W.plats,mp,...(mp2?[mp2]:[]),...(mp3?[mp3]:[])];
  for(const p of all){
    if(!rc(pl.x,pl.y,pl.w,pl.h,p.x,p.y,p.w,p.h)) continue;
    const ox=Math.min(pl.x+pl.w,p.x+p.w)-Math.max(pl.x,p.x);
    const oy=Math.min(pl.y+pl.h,p.y+p.h)-Math.max(pl.y,p.y);
    if(oy<=ox){
      if(pl.y+pl.h/2<p.y+p.h/2){pl.y=p.y-pl.h;if(pl.vy>0){pl.vy=0;pl.onGround=true;pl.jumps=0;}}
      else{pl.y=p.y+p.h;if(pl.vy<0)pl.vy=1;}
    }else{
      if(pl.x+pl.w/2<p.x+p.w/2)pl.x=p.x-pl.w; else pl.x=p.x+p.w;
      pl.vx=0;
    }
  }
}

function spikeHit(){
  if(inv>0) return;
  for(const s of W.spikes){
    if(rc(pl.x+3,pl.y+18,pl.w-6,pl.h-18,s.x+2,s.y-13,s.w-4,13)){die();return;}
  }
}

// ── Teclado / Touch ──────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  // Enter/Space en el menú inicia el juego
  if(state==='menu'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyW'||e.code==='ArrowUp')){
    startGame();
  }
});
window.addEventListener('keyup',e=>keys[e.code]=false);
const touch={left:false,right:false,jump:false,_jh:false};
function addHold(el,flag){
  const on=()=>{touch[flag]=true;el.classList.add('pressed');};
  const off=()=>{touch[flag]=false;el.classList.remove('pressed');};
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  el.addEventListener('touchcancel',off);
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
addHold(document.getElementById('btn-left'),'left');
addHold(document.getElementById('btn-right'),'right');
addHold(document.getElementById('btn-jump'),'jump');
const isLeft=()=>keys['ArrowLeft']||keys['KeyA']||touch.left;
const isRight=()=>keys['ArrowRight']||keys['KeyD']||touch.right;
const isJump=()=>keys['Space']||keys['ArrowUp']||keys['KeyW']||touch.jump;

// ── Inicio de juego ──────────────────────────────
function startGame(){
  state='playing';
  lives=3; score=0; worldIdx=0;
  loadWorld(0); pl=mkPl(); inv=90;
  fws=[]; setMsg(''); setHUD();
}

// ── Enemigos ─────────────────────────────────────
function stompEnemy(e){
  pl.vy=-10; pl.jumps=1; inv=10;
  e.hpCur--;
  e.dmgFlash=18;
  if(e.hpCur<=0){
    e.alive=false;
    score+=50+worldIdx*20; setHUD();
    spawnFW(e.x+16, e.y-10);
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive) continue;
    e.x+=e.spd*e.dir;
    if(e.pb){
      const mn=e.pb.x+4, mx=e.pb.x+e.pb.w-36;
      if(e.x>=mx){e.x=mx;e.dir=-1;} else if(e.x<=mn){e.x=mn;e.dir=1;}
    }else{
      if(e.x>e.ox+e.range){e.x=e.ox+e.range;e.dir=-1;}
      else if(e.x<e.ox){e.x=e.ox;e.dir=1;}
    }
    if(e.dmgFlash>0) e.dmgFlash--;
    e.ft++; if(e.ft%8===0) e.frame=(e.frame+1)%4;
    if(pl.vy>1&&inv<=0){
      const plBot=pl.y+pl.h, eTop=e.y+2;
      if(plBot>=eTop&&plBot<=eTop+16&&pl.x+pl.w-6>e.x+6&&pl.x+6<e.x+30){
        stompEnemy(e); return;
      }
    }
    if(inv<=0&&rc(pl.x+5,pl.y+8,pl.w-10,pl.h-14,e.x+4,e.y+4,28,16)){die();return;}
    if(e.shoots){
      e.shootTimer--;
      if(e.shootTimer<=0){
        e.shootTimer=(e.shootCd||120)+(Math.random()*30|0);
        const dx=pl.x+15-(e.x+16);
        if(Math.abs(dx)<480){
          const spd=worldIdx>=5?3.8:3.0;
          projectiles.push({
            wx:e.x+(dx>0?32:0), wy:e.y+10,
            vx:dx>0?spd:-spd, vy:-0.4,
            col:worldIdx>=5?'#bb44ff':worldIdx>=4?'#ff6600':'#ff4400',
            life:1, age:0
          });
        }
      }
    }
  }
  for(const p of projectiles){
    p.wx+=p.vx; p.wy+=p.vy; p.vy+=0.1;
    p.age++; p.life=Math.max(0,1-p.age/220);
    for(const pl2 of W.plats){
      if(rc(p.wx,p.wy,8,8,pl2.x,pl2.y,pl2.w,pl2.h)){p.life=0;break;}
    }
    if(inv<=0&&rc(p.wx,p.wy,8,8,pl.x+3,pl.y+3,pl.w-6,pl.h-6)){p.life=0;die();return;}
  }
  projectiles=projectiles.filter(p=>p.life>0&&p.wx>camX-60&&p.wx<camX+CW+60);
}

// ── Update principal ─────────────────────────────
function update(){
  // ── MENÚ: solo animar fuegos artificiales decorativos ──
  if(state==='menu'){
    menuTick++;
    if(menuTick%55===0) spawnFW(80+Math.random()*520, 30+Math.random()*120);
    tickFW();
    return;
  }

  if(state==='dead'){
    if(--deathT<=0){
      state='playing';
      pl=checkpointActive&&checkpointX!==null?mkPl(checkpointX,GY-44):mkPl();
      inv=100; setMsg(''); setHUD();
    }
    return;
  }
  if(state==='win'){
    winT++; if(winT%10===0) spawnFW(100+Math.random()*480,40+Math.random()*160);
    tickFW();
    if(++celebT>210){
      if(worldIdx<5){worldIdx++;loadWorld(worldIdx);pl=mkPl();inv=90;state='playing';setMsg('');setHUD();}
      else state='final';
    }
    return;
  }
  if(state==='final'){winT++;if(winT%10===0)spawnFW(100+Math.random()*480,40+Math.random()*160);tickFW();return;}

  if(inv>0) inv--;

  const movPlat=p=>{p.x+=p.spd*p.dir;if(p.x>p.ox+p.range||p.x<p.ox)p.dir*=-1;};
  movPlat(mp); if(mp2)movPlat(mp2); if(mp3)movPlat(mp3);

  const left=isLeft(),right=isRight(),jump=isJump();
  const j1=worldIdx>=3?-12.2:-13.2, j2=worldIdx>=3?-9.8:-10.8;
  if(left){pl.vx=-SPD;pl.dir=-1;} else if(right){pl.vx=SPD;pl.dir=1;} else pl.vx*=0.72;

  if(jump&&!keys['_jh']&&!touch._jh&&pl.jumps<2){
    pl.vy=pl.jumps===0?j1:j2; pl.jumps++;
    if(touch.jump)touch._jh=true; else keys['_jh']=true;
  }
  if(!touch.jump)touch._jh=false;
  if(!keys['Space']&&!keys['ArrowUp']&&!keys['KeyW'])keys['_jh']=false;

  pl.vy+=GRAV; if(pl.vy>18)pl.vy=18;
  pl.x+=pl.vx; pl.y+=pl.vy;
  if(pl.x<0)pl.x=0; if(pl.x+pl.w>WW)pl.x=WW-pl.w;
  resolve(); spikeHit();

  if(worldIdx===3&&checkpointX!==null&&!checkpointActive&&pl.x>checkpointX+20){
    checkpointActive=true;
    setMsg('✅ ¡Checkpoint activado!');
    setTimeout(()=>setMsg(''),2000);
  }

  if(extraLife&&!extraLife.collected){
    extraLife.pulse+=0.1;
    if(rc(pl.x,pl.y,pl.w,pl.h,extraLife.x-10,extraLife.y-10,26,26)){
      extraLife.collected=true;
      lives++; setHUD();
      spawnFW(extraLife.x+6, extraLife.y+6);
      setMsg('🩷 ¡+1 Vida extra!');
      setTimeout(()=>setMsg(''),2000);
    }
  }

  updateEnemies();
  if(pl.y>CH+40) die();

  const ns=Math.max(score,Math.floor((pl.x/WW)*100)+(worldIdx*100));
  if(ns>score){score=ns;setHUD();}
  pl.ft++; if(Math.abs(pl.vx)>0.5&&pl.onGround&&pl.ft%9===0)pl.frame++;
  if(!pl.onGround)pl.frame=1;

  camX+=(pl.x-CW*0.32-camX)*0.12;
  camX=Math.max(0,Math.min(WW-CW,camX));

  const g=W.goal;
  if(rc(pl.x,pl.y,pl.w,pl.h,g.x,g.y,g.w,g.h+12)){
    state='win'; celebT=0;
    if(worldIdx<5)setMsg(`¡Clau llegó! 🎉 Mundo ${worldIdx+1} superado. ¡Vamos al ${worldIdx+2}!`);
    else setMsg('¡Lo lograste, Clau! 🏆 ¡Los 6 mundos conquistados!');
    for(let i=0;i<5;i++)spawnFW(100+Math.random()*480,40+Math.random()*200);
  }
}

function die(){
  if(state!=='playing'||inv>0) return;
  pl.alive=false; lives--;
  state='dead'; deathT=lives<=0?220:140;
  const frases=[
    '¡Tú puedes, Clau! 💪','¡Clau no se rinde! 🎀','¡Arriba ese ánimo, Clau! 🐣',
    '¡Vamos Clau, otra vez! ⭐','¡Esquiva esos gusanos, Clau! 🪱','¡Clau es imparable! 🔥',
    '¡Casi lo logras, Clau! 🌟','¡Respira y vuelve a intentarlo! 🌸',
    '¡Clau siempre se levanta! 💛','¡Los gusanos no pueden con Clau! 🐣',
  ];
  deathMsg=frases[Math.random()*frases.length|0];
  if(lives<=0){lives=3;score=0;loadWorld(worldIdx=0);pl=mkPl();}
  setMsg(''); setHUD();
}

// ── Dibujo ───────────────────────────────────────
const wx=x=>x-camX;

function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,W.sky[0]); sky.addColorStop(1,W.sky[1]);
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH);
  if(W.bgStars){
    ctx.fillStyle=worldIdx===5?'rgba(180,160,255,0.9)':'rgba(255,255,255,0.8)';
    [[50,20],[150,35],[300,15],[450,28],[600,10],[650,40],[200,8],[500,22],[380,38],
     [80,60],[250,70],[420,50],[560,65],[700,55],[620,80],[100,90],[350,85]].forEach(([sx,sy])=>{
      ctx.beginPath();ctx.arc(sx,sy,1.2,0,Math.PI*2);ctx.fill();
    });
  }
  if(worldIdx===0){
    ctx.fillStyle='#FFE066';ctx.beginPath();ctx.arc(CW-60,48,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,224,102,0.18)';ctx.beginPath();ctx.arc(CW-60,48,42,0,Math.PI*2);ctx.fill();
  }else if(worldIdx===1){
    const g2=ctx.createRadialGradient(CW-60,50,5,CW-60,50,35);
    g2.addColorStop(0,'#ffdd44');g2.addColorStop(1,'#ff8800');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(CW-60,50,30,0,Math.PI*2);ctx.fill();
  }else if(worldIdx===2){
    ctx.fillStyle='#ffffcc';ctx.beginPath();ctx.arc(CW-70,55,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=W.sky[0];ctx.beginPath();ctx.arc(CW-58,48,16,0,Math.PI*2);ctx.fill();
  }else if(worldIdx===4){
    ctx.fillStyle='rgba(255,60,0,0.08)';ctx.fillRect(0,CH/2,CW,CH/2);
  }else if(worldIdx===5){
    ctx.fillStyle='rgba(80,0,150,0.12)';ctx.beginPath();ctx.ellipse(200,CH/2,180,80,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,80,180,0.10)';ctx.beginPath();ctx.ellipse(500,CH/2-20,160,70,-0.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6644aa';ctx.beginPath();ctx.arc(CW-70,55,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=W.sky[1];ctx.beginPath();ctx.arc(CW-60,48,18,0,Math.PI*2);ctx.fill();
  }
  if(W.clouds&&W.clouds.length){
    ctx.fillStyle=worldIdx===2?'rgba(80,100,160,0.5)':'rgba(255,255,255,0.82)';
    W.clouds.forEach(([cx,cy,rw,rh])=>{
      const sx=cx-camX*0.38;if(sx<-120||sx>CW+80)return;
      ctx.beginPath();ctx.ellipse(sx,cy,rw,rh,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx+22,cy+6,rw*.6,rh*.6,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx-14,cy+5,rw*.5,rh*.5,0,0,Math.PI*2);ctx.fill();
    });
  }
  const segs=W.plats.filter(p=>p.g);
  segs.forEach(p=>{
    const sx=wx(p.x);if(sx>CW||sx+p.w<0)return;
    ctx.fillStyle=W.ground;ctx.fillRect(sx,GY,p.w,60);
    ctx.fillStyle=W.gline;
    if(worldIdx<3){
      for(let i=0;i<p.w;i+=18){ctx.beginPath();ctx.moveTo(sx+i,GY);ctx.lineTo(sx+i+9,GY-10);ctx.lineTo(sx+i+18,GY);ctx.fill();}
    }else{ctx.fillRect(sx,GY,p.w,4);}
  });
  for(let i=0;i<segs.length-1;i++){
    const a=segs[i],b=segs[i+1],gap=b.x-(a.x+a.w);if(gap<=0)continue;
    const sx=wx(a.x+a.w);
    if(worldIdx===4){
      const lc=`rgb(255,${70+Math.sin(Date.now()*0.004+i)*35|0},0)`;
      ctx.fillStyle=lc;ctx.fillRect(sx,GY+2,gap,58);
      ctx.fillStyle='rgba(255,200,50,0.6)';ctx.fillRect(sx,GY+2,gap,5);
    }else{ctx.fillStyle=W.pitCol;ctx.fillRect(sx,GY,gap,60);}
  }
}

function drawPlats(){
  const movs=[mp,...(mp2?[mp2]:[]),...(mp3?[mp3]:[])];
  [...W.plats.filter(p=>!p.g),...movs].forEach(p=>{
    const sx=wx(p.x);if(sx>CW||sx+p.w<0)return;
    const isM=movs.includes(p);
    ctx.fillStyle=isM?(worldIdx>=3?'#aa4400':'#c06030'):W.platCol;
    ctx.fillRect(sx,p.y,p.w,p.h);
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(sx,p.y+p.h-4,p.w,4);
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1;
    for(let b=0;b<p.w;b+=26)ctx.strokeRect(sx+b,p.y,Math.min(26,p.w-b),p.h);
  });
}

function drawSpikes(){
  W.spikes.forEach(s=>{
    const sx=wx(s.x);if(sx>CW||sx+s.w<0)return;
    const n=Math.floor(s.w/10);
    for(let i=0;i<n;i++){
      ctx.fillStyle=worldIdx>=5?'#aa66ff':worldIdx>=4?'#ff6622':worldIdx===2?'#88aaff':'#d0d0d0';
      ctx.beginPath();ctx.moveTo(sx+i*10,s.y);ctx.lineTo(sx+i*10+5,s.y-13);ctx.lineTo(sx+i*10+10,s.y);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle=worldIdx>=5?'#6600cc':worldIdx>=4?'#cc3300':'#888';ctx.lineWidth=0.8;ctx.stroke();
    }
  });
}

function drawCheckpoint(){
  if(worldIdx!==3||checkpointX===null)return;
  const sx=wx(checkpointX);if(sx<-60||sx>CW+60)return;
  const bob=Math.sin(Date.now()*0.004)*3;
  ctx.fillStyle='#555';ctx.fillRect(sx+10,GY-68+bob,4,68);
  ctx.fillStyle=checkpointActive?'#00ff88':'#bbbbbb';
  ctx.beginPath();ctx.moveTo(sx+14,GY-68+bob);ctx.lineTo(sx+38,GY-58+bob);ctx.lineTo(sx+14,GY-48+bob);ctx.closePath();ctx.fill();
  if(checkpointActive){ctx.fillStyle='rgba(0,255,136,0.2)';ctx.beginPath();ctx.arc(sx+12,GY-50,22,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle=checkpointActive?'#00ff88':'#fff';
  ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText(checkpointActive?'✅ CP':'CP',sx+12,GY-6);
  ctx.textAlign='left';
}

function drawExtraLife(){
  if(!extraLife||extraLife.collected)return;
  const sx=wx(extraLife.x);if(sx<-40||sx>CW+40)return;
  const bob=Math.sin(extraLife.pulse)*5;
  const glow=Math.abs(Math.sin(extraLife.pulse))*0.55+0.3;
  ctx.save();
  ctx.globalAlpha=glow*0.4;
  ctx.fillStyle='#ff88cc';
  ctx.beginPath();ctx.arc(sx+6,extraLife.y+5+bob,18,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx+6,extraLife.y+5+bob);
  ctx.fillStyle='#ff2266';
  ctx.beginPath();ctx.arc(-4,-3,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-3,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.lineTo(0,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,200,220,0.7)';
  ctx.beginPath();ctx.arc(-3,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText('+1♥',sx+6,extraLife.y-10+bob);
  ctx.textAlign='left';
}

function drawGoal(){
  const g=W.goal,sx=wx(g.x);if(sx>CW||sx+g.w<0)return;
  const{y,h}=g;
  ctx.fillStyle='#aaa';ctx.fillRect(sx+11,y,6,h+14);
  ctx.fillStyle='#ccc';ctx.fillRect(sx+11,y,2,h+14);
  const wave=Math.sin((winT||Date.now()*.005)*.09)*6;
  const fc=worldIdx>=5?'#aa00ff':worldIdx>=4?'#ff6600':'#e82020';
  ctx.fillStyle=fc;
  ctx.beginPath();ctx.moveTo(sx+17,y);ctx.lineTo(sx+42,y+9+wave);ctx.lineTo(sx+17,y+18);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(sx+17,y+1,4,6);
  ctx.fillStyle='#5a3e1b';ctx.fillRect(sx+6,y+h+12,20,8);
  ctx.fillStyle='#2ecc40';ctx.font='bold 11px monospace';ctx.textAlign='left';
  ctx.fillText('META',sx-6,y-10);
}

function darken(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-55)},${Math.max(0,g-55)},${Math.max(0,b-55)})`;
}

function drawWorm(e){
  const sx=wx(e.x);if(sx>CW+60||sx+40<0)return;
  ctx.save();
  ctx.translate(sx+16,e.y+11);
  if(e.dmgFlash>0)ctx.globalAlpha=0.5;
  ctx.scale(e.dir,1);
  const bc=e.dmgFlash>0?'#ffffff':e.col;
  const dk=darken(e.col);
  const fr=e.frame;
  const segs=[{ox:-12,oy:0,rx:7,ry:5},{ox:-2,oy:fr%2?-2:2,rx:8,ry:5.5},{ox:8,oy:fr%2?2:-2,rx:7,ry:5},{ox:17,oy:0,rx:6,ry:4.5}];
  segs.forEach((s,i)=>{
    ctx.fillStyle=i===0?dk:bc;
    ctx.beginPath();ctx.ellipse(s.ox,s.oy,s.rx,s.ry,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=dk;ctx.lineWidth=0.8;ctx.stroke();
  });
  ctx.fillStyle=dk;ctx.beginPath();ctx.ellipse(24,0,9,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(27,-2,3.2,3.2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(28,-2,1.6,1.6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(28.5,-2.5,0.7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(30,2);ctx.lineTo(33,1);ctx.lineTo(34,3);ctx.lineTo(31,4);ctx.closePath();ctx.fill();
  ctx.strokeStyle=dk;ctx.lineWidth=1;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(26,-6);ctx.lineTo(23,-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(29,-5);ctx.lineTo(30,-11);ctx.stroke();
  ctx.fillStyle=bc;ctx.beginPath();ctx.arc(23,-11,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(30,-11,2.2,0,Math.PI*2);ctx.fill();
  if(e.hp>1){
    ctx.scale(1/e.dir,1);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-15,-22,30,5);
    const pct=e.hpCur/e.hp;
    ctx.fillStyle=pct>0.6?'#44ff44':pct>0.3?'#ffaa00':'#ff3333';
    ctx.fillRect(-15,-22,30*pct,5);
  }
  ctx.restore();
}

function drawProjectiles(){
  for(const p of projectiles){
    const sx=wx(p.wx);if(sx<-10||sx>CW+10)continue;
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(sx+4,p.wy+4,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,180,0.85)';
    ctx.beginPath();ctx.arc(sx+3,p.wy+3,2.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.globalAlpha=p.life*0.35;
    ctx.beginPath();ctx.moveTo(sx+4,p.wy+4);ctx.lineTo(sx+4-p.vx*4,p.wy+4);ctx.stroke();
    ctx.restore();
  }
}

function drawClau(px,py,dir,frame,alive){
  const sx=wx(px);
  ctx.save();ctx.translate(sx+15,py+14);
  if(!alive){ctx.rotate(Math.PI/2*dir);ctx.globalAlpha=0.42;}
  else if(inv>0&&Math.floor(inv/5)%2===0)ctx.globalAlpha=0.35;
  ctx.scale(dir,1);
  ctx.fillStyle='#FFD700';
  ctx.beginPath();ctx.ellipse(0,5,12,10,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-7,10,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFA500';ctx.beginPath();ctx.ellipse(8,-5,4.5,2.8,.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(6,-11,2.4,2.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-12,.9,.9,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(5,-14);ctx.lineTo(4.5,-16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-14.2);ctx.lineTo(7,-16.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8.5,-13.5);ctx.lineTo(9.2,-15.3);ctx.stroke();
  ctx.fillStyle='#FF6600';ctx.beginPath();ctx.moveTo(8,-6);ctx.lineTo(13,-5);ctx.lineTo(8,-4);ctx.closePath();ctx.fill();
  const lo=frame%2===0?3:-3;
  ctx.strokeStyle='#cc8800';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-3,13);ctx.lineTo(-3+lo,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(3,13);ctx.lineTo(3-lo,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-3+lo,20);ctx.lineTo(-3+lo-4,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(3-lo,20);ctx.lineTo(3-lo+4,20);ctx.stroke();
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.ellipse(-11,2,6,4,-.4,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.scale(1/dir,1);
  const lx=-3,ly=-19;
  ctx.fillStyle='#e8003a';
  ctx.beginPath();ctx.ellipse(lx-4,ly,4,2.5,-.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(lx+4,ly,4,2.5,.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4477';ctx.beginPath();ctx.ellipse(lx,ly,2,2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath();ctx.arc(lx-5,ly-0.5,0.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(lx+5,ly-0.5,0.7,0,Math.PI*2);ctx.fill();
  ctx.restore();ctx.restore();
}

function drawProgress(){
  const bw=220,bh=9,bx=CW/2-bw/2,by=10;
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.roundRect(bx-1,by-1,bw+2,bh+2,4);ctx.fill();
  const bgCols=['#5a8a3f','#7a3510','#1a3060','#1a4020','#5a1800','#050520'];
  ctx.fillStyle=bgCols[worldIdx]||'#1a1a2e';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,4);ctx.fill();
  const prog=Math.min(1,pl.x/WW);
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.roundRect(bx,by,bw*prog,bh,4);ctx.fill();
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(bx+bw*prog,by+bh/2,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8003a';
  ctx.beginPath();ctx.ellipse(bx+bw*prog-3,by+bh/2-4,2.5,1.5,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bx+bw*prog+3,by+bh/2-4,2.5,1.5,.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4477';ctx.beginPath();ctx.arc(bx+bw*prog,by+bh/2-4,1.5,0,Math.PI*2);ctx.fill();
  ['1','2','3','4','5','6'].forEach((n,i)=>{
    const dx=bx+bw*(i/5.5+0.03);
    ctx.fillStyle=i<worldIdx?'#FFD700':i===worldIdx?'#fff':'rgba(255,255,255,0.3)';
    ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('W'+n,dx,by-3);
  });
  ctx.textAlign='left';
}

function drawFW(){
  fws.forEach(fw=>{
    fw.parts.forEach(p=>{
      if(p.life<=0)return;
      // En el menú los fuegos no usan camX (wx), son coordenadas de pantalla directas
      const sx = (state==='menu') ? (fw.wx+p.px) : wx(fw.wx+p.px);
      const sy=fw.wy+p.py;
      if(sx<-10||sx>CW+10)return;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life*fw.life);
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(sx,sy,2.8,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
  });
}

// ── DIBUJO DEL MENÚ PRINCIPAL ────────────────────
function drawMenu(){
  // Fondo degradado oscuro a azul
  const sky=ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#050518'); sky.addColorStop(1,'#0d2a50');
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,CH);

  // Estrellas de fondo
  ctx.fillStyle='rgba(255,255,255,0.75)';
  [[40,18],[130,32],[280,14],[430,26],[580,10],[645,38],[195,9],[490,20],[370,36],
   [75,58],[240,68],[415,48],[555,62],[695,52],[615,78],[95,88],[345,83],[500,72]].forEach(([sx,sy])=>{
    ctx.beginPath();ctx.arc(sx,sy,1.1,0,Math.PI*2);ctx.fill();
  });

  // Planeta decorativo fondo
  ctx.save();
  ctx.globalAlpha=0.18;
  ctx.fillStyle='#3366cc';
  ctx.beginPath();ctx.arc(580,260,90,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2244aa';
  ctx.beginPath();ctx.arc(580,260,60,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Nube decorativa izquierda
  ctx.save();
  ctx.globalAlpha=0.12;
  ctx.fillStyle='#aaddff';
  ctx.beginPath();ctx.ellipse(80,200,70,30,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  function txt(t,x,y,fill,font,shadowAlpha=0.6,sOff=3){
    ctx.font=font; ctx.textAlign='center';
    ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`; ctx.fillText(t,x+sOff,y+sOff);
    ctx.fillStyle=fill; ctx.fillText(t,x,y);
  }

  // Título con efecto pulsante
  const pulse=Math.sin(menuTick*0.05)*3;
  ctx.save();
  ctx.shadowColor='#FFD700';
  ctx.shadowBlur=18+pulse*2;
  txt('🐣 POLLICLAU',CW/2,88,'#FFD700','bold 58px Courier New,monospace');
  ctx.restore();
  txt('Aventuras de PolliClau, la futura obstetra',CW/2,120,'#aaddff','bold 18px Courier New,monospace',0.5,2);

  // Separador decorativo
  ctx.strokeStyle='rgba(255,215,0,0.3)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(CW/2-140,134);ctx.lineTo(CW/2+140,134);ctx.stroke();

  // Mundos en miniaturas decorativas
  const worldColors=['#8bc34a','#c47a2a','#1a3060','#1a4020','#5a1a00','#050530'];
  const worldEmojis=['🌷','🐻','🍬','🌙','⭐','🤍'];
  const ww=38,wh=22,gap=10;
  const totalW=6*ww+5*gap;
  const startX=CW/2-totalW/2;
  worldColors.forEach((col,i)=>{
    const wx2=startX+i*(ww+gap);
    const wy2=148;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.roundRect(wx2+2,wy2+2,ww,wh,5);ctx.fill();
    ctx.fillStyle=col;
    ctx.beginPath();ctx.roundRect(wx2,wy2,ww,wh,5);ctx.fill();
    ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText(worldEmojis[i],wx2+ww/2,wy2+wh-5);
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='bold 7px monospace';
    ctx.fillText('W'+(i+1),wx2+ww/2,wy2+10);
  });
  ctx.textAlign='left';

  // Botón JUGAR (pulsante)
  const bw=230,bh=56,bx=CW/2-bw/2,by=190;
  const bp=Math.sin(menuTick*0.07)*2;
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.roundRect(bx+4,by+4+bp,bw,bh,16);ctx.fill();
  // Fondo botón
  const btnGrad=ctx.createLinearGradient(bx,by+bp,bx,by+bh+bp);
  btnGrad.addColorStop(0,'#FFE033');
  btnGrad.addColorStop(1,'#FFB300');
  ctx.fillStyle=btnGrad;
  ctx.beginPath();ctx.roundRect(bx,by+bp,bw,bh,16);ctx.fill();
  // Brillo superior
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();ctx.roundRect(bx+6,by+bp+4,bw-12,18,10);ctx.fill();
  // Texto botón
  ctx.fillStyle='#1a1a2e';
  ctx.font='bold 24px Courier New,monospace';
  ctx.textAlign='center';
  ctx.fillText('▶   JUGAR',CW/2,by+36+bp);
  ctx.textAlign='left';
  window._playBtn={x:bx,y:by+bp-6,w:bw,h:bh+12};

  // Instrucciones
  txt('← → Mover   |   Espacio / ↑ Saltar (Si clau, puedes saltar doble jajaja)',CW/2,270,'#88bbdd','12px Courier New,monospace',0.4,1);
  txt('Brinca encima para matar gusanos   |   Recoge vidas extra',CW/2,288,'#88bbdd','11px Courier New,monospace',0.4,1);
  txt('Suerte',CW/2,306,'rgba(100,140,180,0.7)','10px Courier New,monospace',0.3,1);

  // Separador
  ctx.strokeStyle='rgba(255,215,0,0.15)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(CW/2-160,315);ctx.lineTo(CW/2+160,315);ctx.stroke();

  // Créditos / versión
  txt('🐣 Aventuras de PolliClau',CW/2,334,'rgba(80,120,160,0.6)','9px Courier New,monospace',0.2,1);

  // Hint "Presiona Espacio"
  if(Math.floor(menuTick/28)%2===0){
    txt('Presiona  ESPACIO  o haz clic para jugar',CW/2,358,'rgba(200,230,255,0.55)','bold 10px Courier New,monospace',0.2,1);
  }

  // Fuegos artificiales decorativos encima de todo
  drawFW();
}

function draw(){
  ctx.clearRect(0,0,CW,CH);

  // ── MENÚ PRINCIPAL ──
  if(state==='menu'){
    drawMenu();
    return;
  }

  // ── JUEGO NORMAL ──
  drawBG();drawPlats();drawSpikes();
  drawCheckpoint();
  drawExtraLife();
  drawGoal();
  for(const e of enemies){if(e.alive)drawWorm(e);}
  drawProjectiles();
  drawClau(pl.x,pl.y,pl.dir,pl.frame,pl.alive);
  drawProgress();drawFW();

  function txt(t,x,y,fill,font,shadow='rgba(0,0,0,0.7)',sOff=3){
    ctx.font=font;ctx.textAlign='center';
    ctx.fillStyle=shadow;ctx.fillText(t,x+sOff,y+sOff);
    ctx.fillStyle=fill;ctx.fillText(t,x,y);
  }

  if(state==='win'){
    ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='#111';ctx.fillRect(0,0,CW,CH);ctx.restore();
    if(worldIdx<5){
      txt(`🎉 ¡Mundo ${worldIdx+1} superado!`,CW/2,CH/2-28,'#FFD700','bold 34px Courier New,monospace');
      txt(`¡Vamos al Mundo ${worldIdx+2}, Clau! ⭐`,CW/2,CH/2+20,'#fff','bold 20px Courier New,monospace');
      const bar=Math.min(1,celebT/210);
      ctx.fillStyle='rgba(255,255,255,0.18)';ctx.beginPath();ctx.roundRect(CW/2-120,CH/2+44,240,12,6);ctx.fill();
      ctx.fillStyle='#FFD700';ctx.beginPath();ctx.roundRect(CW/2-120,CH/2+44,240*bar,12,6);ctx.fill();
    }else{
      txt('¡FELICIDADES CLAU! 🏆',CW/2,CH/2-30,'#FFD700','bold 32px Courier New,monospace');
      txt('¡Superaste los 6 mundos!',CW/2,CH/2+14,'#ffe066','bold 22px Courier New,monospace');
      txt('🐣 ¡Clau es la campeona! 🎀',CW/2,CH/2+46,'#fff','bold 16px Courier New,monospace');
    }
    ctx.textAlign='left';drawFW();
  }

  if(state==='final'){
    ctx.save();ctx.globalAlpha=0.78;ctx.fillStyle='#111';ctx.fillRect(0,0,CW,CH);ctx.restore();
    txt('¡FELICIDADES CLAU! 🏆',CW/2,CH/2-52,'#FFD700','bold 34px Courier New,monospace');
    txt('🎀 ¡Clau conquistó los 6 mundos! 🎀',CW/2,CH/2-8,'#ffe066','bold 20px Courier New,monospace');
    txt('Score: '+score+' pts  •  Mundos: 6/6',CW/2,CH/2+28,'#fff','bold 17px Courier New,monospace');
    txt('🪱 ¡Ningún gusano pudo con Clau! 🐣',CW/2,CH/2+52,'#aaffaa','bold 14px Courier New,monospace');
    if(winT>120){
      const bw=270,bh=50,bx=CW/2-bw/2,by=CH/2+68;
      ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(bx+3,by+3,bw,bh,14);ctx.fill();
      ctx.fillStyle='#FFD700';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,14);ctx.fill();
      ctx.fillStyle='#1a1a2e';ctx.font='bold 20px Courier New,monospace';ctx.textAlign='center';
      ctx.fillText('🐣  ¡Jugar de nuevo!',CW/2,by+34);
      window._restartBtn={x:bx,y:by,w:bw,h:bh};
    }else{window._restartBtn=null;}
    ctx.textAlign='left';drawFW();
  }

  if(state==='dead'){
    ctx.save();ctx.globalAlpha=0.52;ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);ctx.restore();
    txt('¡Pipipi! 🐥',CW/2,CH/2-18,'#FF5555','bold 44px Courier New,monospace');
    txt(deathMsg,CW/2,CH/2+30,'#ffddaa','bold 20px Courier New,monospace');
    if(checkpointActive)txt('↩ Volviendo al checkpoint...',CW/2,CH/2+58,'#88ff88','bold 12px Courier New,monospace');
    ctx.textAlign='left';
  }
}

function getCanvasPos(e){
  const rect=cv.getBoundingClientRect();
  const scaleX=CW/rect.width,scaleY=CH/rect.height;
  const src=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e;
  return{x:(src.clientX-rect.left)*scaleX,y:(src.clientY-rect.top)*scaleY};
}

function doRestart(){
  lives=3;score=0;worldIdx=0;loadWorld(0);pl=mkPl();inv=90;
  state='menu'; winT=0;fws=[];menuTick=0;setMsg('');setHUD();
}

function checkClick(e){
  const{x,y}=getCanvasPos(e);

  // Botón del menú principal
  if(state==='menu'&&window._playBtn){
    const b=window._playBtn;
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
      startGame(); return;
    }
  }

  // Botón reiniciar en pantalla final
  if(state==='final'&&window._restartBtn){
    const b=window._restartBtn;
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)doRestart();
  }
}

cv.addEventListener('click',e=>{cv.focus();checkClick(e);});
cv.addEventListener('touchend',e=>{e.preventDefault();checkClick(e);},{passive:false});

const FRAME_MS=1000/60; let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastT<FRAME_MS-1)return;
  lastT=ts; update(); draw();
}
cv.setAttribute('tabindex','0');cv.focus();
requestAnimationFrame(loop);
</script>
</body>
