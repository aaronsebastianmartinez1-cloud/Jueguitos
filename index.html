<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Clau 🐣 – Aventura de 6 Mundos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="rotate-msg"><div class="icon">📱</div><p>¡Gira tu celular!</p><small>El juego funciona en horizontal 🐣</small></div>
<div id="gw">
  <div id="hud">
    <span>🐣 <b id="hLives">3</b></span>
    <span>⭐ <b id="hScore">0</b></span>
    <span id="hWorld">🌍 Mundo 1</span>
    <span id="hKeys" style="display:none">🔑 <b id="hKeysCount">0</b>/<b id="hKeysTotal">4</b></span>
    <span class="hud-btn" id="btn-sound" title="Sonido">🔊</span>
    <span class="hud-btn" id="btn-pause" title="Pausa">⏸</span>
    <span class="hud-btn" id="btn-exit" title="Salir">🚪</span>
  </div>
  <canvas id="gc" width="680" height="380"></canvas>
  <div id="msg"></div>
  <div id="ctrl">← → Mover &nbsp;|&nbsp; Espacio/↑ Saltar (doble salto) &nbsp;|&nbsp; 🪱 Brinca encima para matar gusanos &nbsp;|&nbsp; 🩷 Recoge vidas extra</div>
  <div id="touch-controls">
    <div class="tzone" id="zone-move">
      <div class="tbtn" id="btn-left">◀</div>
      <div class="tbtn" id="btn-right">▶</div>
    </div>
    <div class="tzone" id="zone-jump">
      <div class="tbtn" id="btn-jump">🐣</div>
    </div>
  </div>
</div>

<!-- Orden de carga importante: cada script depende de que los anteriores
     ya hayan definido sus constantes/funciones globales. Todos son
     scripts clásicos (sin type="module"), así que el juego funciona
     abriendo este archivo directamente con doble clic, sin servidor. -->
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/input.js"></script>
<script src="js/physics.js"></script>
<script src="planets/tierra.js"></script>
<script src="planets/marte.js"></script>
<script src="planets/mercurio.js"></script>
<script src="js/state.js"></script>
<script src="js/entities.js"></script>
<script src="js/render.js"></script>
<script src="js/hazards.js"></script>
<script src="js/ui-menu.js"></script>
<script src="js/ui-planet-select.js"></script>
<script src="js/ui-gameover.js"></script>
<script src="js/ui-exit-confirm.js"></script>
<script src="js/ui-world-intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
